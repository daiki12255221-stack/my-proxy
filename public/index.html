<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Proxy Viewer</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #f4f4f4;
      padding: 10px 20px;
      border-bottom: 1px solid #ddd;
      display: flex;
      gap: 10px;
    }
    form {
      display: flex;
      flex: 1;
      gap: 10px;
    }
    input[type="url"] {
      flex: 1;
      padding: 8px 12px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 8px 16px;
      font-size: 15px;
      background-color: #0070f3;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #999;
      cursor: not-allowed;
    }
    .error-banner {
      background: #ffe6e6;
      color: #c00;
      padding: 10px 20px;
      display: none;
    }
    #preview-frame {
      flex: 1;
      width: 100%;
      border: none;
      background: #fff;
    }
  </style>
</head>
<body>

  <header>
    <form id="proxy-form">
      <input type="url" id="url-input" placeholder="https://example.com" required />
      <button type="submit" id="submit-btn">表示する</button>
    </form>
  </header>

  <div id="error-box" class="error-banner"></div>

  <iframe id="preview-frame"></iframe>

  <script>
    const form = document.getElementById('proxy-form');
    const urlInput = document.getElementById('url-input');
    const submitBtn = document.getElementById('submit-btn');
    const errorBox = document.getElementById('error-box');
    const previewFrame = document.getElementById('preview-frame');

    // URLのクエリパラメータ (?url=...) をチェックする関数
    function getQueryParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    // ページ読み込み時に ?url= があれば自動で読み込む
    window.addEventListener('DOMContentLoaded', () => {
      const targetUrl = getQueryParam('url');
      if (targetUrl) {
        urlInput.value = targetUrl;
        loadProxyPage(targetUrl);
      }
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const targetUrl = urlInput.value.trim();
      if (!targetUrl) return;

      // ブラウザのURLを `?url=...` の形に書き換える（ページリロードなし）
      const newRelativePathQuery = window.location.pathname + '?url=' + encodeURIComponent(targetUrl);
      window.history.pushState(null, '', newRelativePathQuery);

      loadProxyPage(targetUrl);
    });

    async function loadProxyPage(targetUrl) {
      submitBtn.disabled = true;
      submitBtn.textContent = '読み込み中...';
      errorBox.style.display = 'none';
      previewFrame.srcdoc = '<p style="padding: 20px; font-family: sans-serif;">読み込み中...</p>';

      try {
        const response = await fetch(`/api/proxy?url=${encodeURIComponent(targetUrl)}`);

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error || 'ページの取得に失敗しました。');
        }

        const htmlText = await response.text();
        previewFrame.srcdoc = htmlText;
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
        previewFrame.srcdoc = '';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '表示する';
      }
    }
  </script>
</body>
</html>
