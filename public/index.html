<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS + HTML 簡易プロキシ (ブラウザ表示版)</title>
  <style>
    body {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 20px;
      font-family: sans-serif;
    }
    .form-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="url"] {
      flex: 1;
      padding: 10px 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #0070f3;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #999;
      cursor: not-allowed;
    }
    .error {
      color: red;
      padding: 10px;
      border: 1px solid red;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }
    /* iframeの表示領域スタイル */
    #preview-frame {
      width: 100%;
      height: 700px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background-color: #fff;
    }
  </style>
</head>
<body>

  <h1>Web プロキシ (Webページ表示)</h1>

  <form id="proxy-form" class="form-container">
    <input type="url" id="url-input" placeholder="https://example.com" required />
    <button type="submit" id="submit-btn">ページを表示</button>
  </form>

  <div id="error-box" class="error"></div>

  <div id="result-container" style="display: none;">
    <h2>プレビュー結果</h2>
    <!-- レンダリング用の iframe -->
    <iframe id="preview-frame"></iframe>
  </div>

  <script>
    const form = document.getElementById('proxy-form');
    const urlInput = document.getElementById('url-input');
    const submitBtn = document.getElementById('submit-btn');
    const errorBox = document.getElementById('error-box');
    const resultContainer = document.getElementById('result-container');
    const previewFrame = document.getElementById('preview-frame');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const targetUrl = urlInput.value.trim();

      if (!targetUrl) return;

      // 状態リセット
      submitBtn.disabled = true;
      submitBtn.textContent = '読み込み中...';
      errorBox.style.display = 'none';
      resultContainer.style.display = 'none';
      previewFrame.srcdoc = '';

      try {
        const response = await fetch(`/api/proxy?url=${encodeURIComponent(targetUrl)}`);

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error || 'ページの取得に失敗しました。');
        }

        const htmlText = await response.text();
        
        // iframeに取得したHTMLをセットしてレンダリング
        previewFrame.srcdoc = htmlText;
        resultContainer.style.display = 'block';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'ページを表示';
      }
    });
  </script>
</body>
</html>
